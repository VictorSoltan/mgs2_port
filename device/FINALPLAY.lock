# Builds are reproducible only after normalisation: two builds of identical
# WineD3D sources differ in exactly three bytes -- the COFF TimeDateStamp and
# two bytes of the optional-header CheckSum. harness/pe_normalised_sha.py zeroes
# both. Passing -Wl,--no-insert-timestamp at the next release would make the raw
# hashes match too.
wined3d_normalised_sha256_of_current_tree  8766a9645fde9cf2a7f6008c7011dfda63822715cd879a806eac1f03a1670072

