# Where the production sources come from, and what they build to.
#
# Neither source tree is in this repository and one is in no repository at all,
# so these two bases plus the two complete patches beside them ARE the record.
# harness/verify_rebuild.sh checks they still reconstruct the live trees;
# harness/make_release.sh is the only thing that should produce a release, and
# it generates the manifest from the bytes it just built.

wine_base_tarball    wine-11.0.tar.xz
wine_base_sha256     c07a6857933c1fc60dff5448d79f39c92481c1e9db5aa628db9d0358446e0701
wine_complete_patch  wine-patches/FINALPLAY14-wine-complete.patch
wine_files_changed   53 modified, 1 deleted

box86_base_remote    https://github.com/ptitSeb/box86.git
box86_base_commit    0579f8b9
box86_complete_patch box86-patches/FINALPLAY14-box86-complete.patch
box86_files_changed  21 tracked, 14 previously untracked and recorded nowhere else

# Builds are byte-reproducible, so the manifest carries exact hashes. Two things
# had to be pinned to get there, each found by building the same source twice:
#   WineD3D  -Wl,--no-insert-timestamp   three bytes differed, the PE
#                                        TimeDateStamp and the header checksum
#   Box86    SOURCE_DATE_EPOCH           twenty-three, because src/build_info.c
#                                        prints __DATE__/__TIME__ and the GNU
#                                        build-id followed the change
# harness/pe_normalised_sha.py is kept for investigating binaries built before
# this, but production provenance no longer depends on normalisation.
source_date_epoch    1756000000
wined3d_ldflags      -Wl,--disable-stdcall-fixup -Wl,--no-insert-timestamp

# Generated by make_release.sh and verified on the device by the launcher against
# device/FINALPLAY.manifest, which now covers all eleven mounted files rather than
# these three.
#
# The key names carry no release number any more. They used to -- box86_fp13_sha256
# -- which meant every release renamed a key that harness/verify_rebuild.sh reads
# BY NAME, and that rename is precisely the step nobody remembers. make_release.sh
# rewrites all four of these lines itself.
release_name         fp14
box86_sha256         e227b39f151e99efd75f353f1a521cb2d82cb0bb82cb384a4f28b70b3a3556ba
wined3d_sha256       f266e9febdc2dd98a277bfe785aec949b929acaae606e0eb996c9c9bbdd5f341
presenter_sha256     51879e2d706d434e3bf140508e31493802d9506753a16b295be81df154f9f169

