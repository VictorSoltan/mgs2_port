# Builds are byte-reproducible, so the manifest carries exact hashes. These
# timestamp sources were pinned after building the same source twice:
#   WineD3D  -Wl,--no-insert-timestamp   three bytes differed, the PE
#                                        TimeDateStamp and the header checksum
#   Box86    SOURCE_DATE_EPOCH           twenty-three, because src/build_info.c
#                                        prints __DATE__/__TIME__ and the GNU
#                                        build-id followed the change
#   DXVK     per-DLL epoch + b_ndebug     PE timestamp and libstdc++ code
# harness/pe_normalised_sha.py is kept for investigating binaries built before
# this, but production provenance no longer depends on normalisation.
source_date_epoch    1756000000
wined3d_ldflags      -Wl,--disable-stdcall-fixup -Wl,--no-insert-timestamp
box86_cflags          -DMGS2_GLIBC24_COMPAT
box86_ldflags         -Wl,--wrap=log10f,--wrap=atan2f,--wrap=asinf,--wrap=acosf,--wrap=sinhf,--wrap=acoshf,--wrap=coshf,--wrap=sqrtf
box86_repro_source    /usr/src/box86
box86_postprocess     strip-debug-remove-build-id
island_repro_wine_source /usr/src/wine-11.0
island_repro_wine_build /usr/build/wine-i386
island_repro_box86_source /usr/src/box86

